<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Ferrer Nafier</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            text-align: center;
            background-color: #ffffff;
            padding: 40px;
            width: 100%;
            max-width: 800px;
        }
        .profile-picture-container {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 3px solid #ddd;
            overflow: hidden;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .profile-picture {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h1 {
            margin-top: 20px;
            margin-bottom: 5px;
        }
        h3 {
            margin-top: 5px;
            font-weight: normal;
            color: #555;
        }
        .social-links {
            margin: 25px 0;
        }
        .social-links a {
            margin: 0 10px;
            text-decoration: none;
        }
        .social-links img {
            width: 32px;
            height: 32px;
            transition: transform 0.2s ease;
        }
        .social-links img:hover {
            transform: scale(1.1);
        }
        hr {
            border: 0;
            height: 1px;
            background: #eee;
            margin-top: 30px;
        }
        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }
            .profile-picture-container {
                width: 120px;
                height: 120px;
            }
            .social-links img {
                width: 28px;
                height: 28px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="profile-picture-container">
            <img src="https://ferrern.github.io/Pasfoto.jpg" class="profile-picture" alt="Foto Profil Ferrer Nafier">
        </div>
        
        <h1>Ferrer Nafier</h1>
        <h3>102022400008 / Fakultas Rekayasa Industri / S1 Sistem Informasi</h3>

        <div class="social-links">
            <a href="https://www.linkedin.com/in/ferrer-nafier-016bbb364/" target="_blank">
                <img src="https://www.svgrepo.com/show/157006/linkedin.svg" alt="Linkedin Icon">
            </a>
            <a href="https://github.com/FerrerN" target="_blank">
                <img src="https://raw.githubusercontent.com/simple-icons/simple-icons/develop/icons/github.svg" alt="Github Icon">
            </a>

            <a href="https://www.instagram.com/nafierferrer/" target="_blank">
                <img src="https://raw.githubusercontent.com/simple-icons/simple-icons/develop/icons/instagram.svg" alt="Instagram Icon">
            </a>
        </div>
        
        <hr>
    </div>
</body>
</html>
